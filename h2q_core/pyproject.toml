[project]
name = "h2q_core"
authors = [{ name = "H2Q", email = "dev@h2q.com.vn" }]
description = "Custom Frappe app for H2Q Headless Construction ERP"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["boto3>=1.34.0", "botocore>=1.34.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "h2q_core"
